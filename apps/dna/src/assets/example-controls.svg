<svg width="960" height="260" viewBox="0 0 960 260" fill="none" xmlns="http://www.w3.org/2000/svg">
    <title>Элементы на поверхности с раскладкой FCL-токенов</title>

    <!-- Панель-поверхность SFC -->
    <rect x="120" y="88" width="812" height="80" rx="16" fill="#080808" stroke="#222222" stroke-width="1.5" />

    <!-- Кнопка ABV -->
    <rect x="152" y="104" width="200" height="48" rx="12" fill="#DBDBDB" />
    <text x="252" y="134" font-family="Roboto Flex, Roboto, system-ui, sans-serif" font-size="16" font-weight="500" fill="#1B1B1B" text-anchor="middle">
        Button
    </text>

    <!-- Поле ввода BLW -->
    <rect x="384" y="104" width="404" height="48" rx="12" fill="#0E0E0E" stroke="#646464" stroke-width="1.5" />
    <text x="404" y="134" font-family="Roboto Flex, Roboto, system-ui, sans-serif" font-size="14" fill="#646464">
        Input field
    </text>

    <!-- Текст на поверхности SFC/FGR -->
    <text x="800" y="136" font-family="Roboto Flex, Roboto, system-ui, sans-serif" font-size="12" fill="#FCFCFC">
        Surface text
    </text>

    <!-- Выноски: единый стиль — прямые линии; FGR и BGR кнопки под одним углом -->
    <g stroke="#646464" stroke-width="1" stroke-dasharray="2 4">
        <line x1="162" y1="40" x2="252" y2="130" />
        <line x1="244" y1="40" x2="320" y2="116" />
        <line x1="368" y1="40" x2="352" y2="128" />
        <line x1="680" y1="40" x2="838" y2="132" />
        <line x1="820" y1="40" x2="904" y2="164" />
        <line x1="916" y1="40" x2="928" y2="88" />
        <line x1="424" y1="216" x2="384" y2="128" />
        <line x1="600" y1="216" x2="452" y2="132" />
        <line x1="760" y1="216" x2="640" y2="140" />
    </g>
    <g fill="#646464">
        <circle cx="252" cy="130" r="3" />
        <circle cx="320" cy="116" r="3" />
        <circle cx="352" cy="128" r="3" />
        <circle cx="838" cy="132" r="3" />
        <circle cx="904" cy="164" r="3" />
        <circle cx="928" cy="88" r="3" />
        <circle cx="384" cy="128" r="3" />
        <circle cx="452" cy="132" r="3" />
        <circle cx="640" cy="140" r="3" />
    </g>
    <g font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#C1C1C1">
        <text x="120" y="32">ABV/DFT/RGL/FGR</text>
        <text x="240" y="32">ABV/DFT/RGL/BGR</text>
        <text x="360" y="32">ABV/DFT/RGL/BRD</text>
        <text x="596" y="32">SFC/DFT/RGL/FGR</text>
        <text x="716" y="32">SFC/DFT/RGL/BGR</text>
        <text x="836" y="32">SFC/DFT/RGL/BRD</text>
        <text x="368" y="224">BLW/DFT/RGL/BRD</text>
        <text x="560" y="224">BLW/DFT/RGL/FGR</text>
        <text x="720" y="224">BLW/DFT/RGL/BGR</text>
    </g>
</svg>
